<!doctype html>
<html lang="en">
  <head>
    <title>Plutchik’s Wheel of Emotions</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An elegant 3D interactive exploration of Robert Plutchik’s Wheel of Emotions.">
    <!-- Open Graph / Social -->
    <meta property="og:title" content="Plutchik’s Wheel of Emotions">
    <meta property="og:description" content="Discover how emotions blend. Joy + Trust = Love. Explore freely or take the guided Emotion Quest.">
    <meta property="og:image" content="https://opengraph.b-cdn.net/production/documents/8f7bad98-1f12-4311-83ad-44f29105ec66.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="background-animations"></div>
    <div class="container">
      <header>
        <h1>Plutchik’s Wheel</h1>
        <div class="header-controls">
          <button id="assess-btn">Emotion Explorer Quest</button>
          <div class="tooltip">?
            <div class="tooltiptext">
              An interactive 3D model of Robert Plutchik’s emotion theory.<br>
              Click any petal to discover its meaning and combinations (e.g., Joy + Trust = Love).<br>
              Or start the guided quest to identify exactly what you’re feeling right now.
            </div>
          </div>
        </div>
      </header>

      <model-viewer src="wheelOfEmotions.glb" id="modelviewer" ar ar-modes="scene-viewer quick-look"
        camera-controls auto-rotate tone-mapping="commerce" poster="poster.webp" shadow-intensity="1" environment-image="neutral">

        <button class="Hotspot" slot="hotspot-2" data-position="-0.0037902662970007352m 0.28031014278531075m -0.19386382665763127m" data-normal="0m 1m 0m" data-visibility-attribute="visible">

        <button class="Hotspot" slot="hotspot-12" data-position="0.09730052338647319m 0.28031014278531075m 0.10325233472497887m" data-normal="0m 1m 0m" data-visibility-attribute="visible">

        <button class="Hotspot" slot="hotspot-23" data-position="-0.1421535255131428m 0.28031014278531075m -0.13673714479833585m" data-normal="0m 1m 0m" data-visibility-attribute="visible">

        <button class="Hotspot" slot="hotspot-24" data-position="-0.10223723422513581m 0.28031014278531075m -0.09712443502379511m" data-normal="0m 1m 0m" data-visibility-attribute="visible">

          <div class="HotspotAnnotation">Submission</div>
        </button>
        <button class="Hotspot dyad" slot="hotspot-awe" data-position="0.12740594618738932m 0.28031014278531075m 0.05926482731970951m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Awe</div>
        </button>
        <button class="Hotspot dyad" slot="hotspot-disapproval" data-position="0.04978630082136615m 0.28031014278531086m 0.13139984448873357m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Disapproval</div>
        </button>
        <button class="Hotspot dyad" slot="hotspot-remorse" data-position="-0.055753617376608174m 0.28031014278531086m 0.1289811188917266m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Remorse</div>
        </button>
        <button class="Hotspot dyad" slot="hotspot-contempt" data-position="-0.12929706313679307m 0.28031014278531075m 0.05501694598338841m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Contempt</div>
        </button>
        <button class="Hotspot dyad" slot="hotspot-aggressiveness" data-position="-0.13134826272144492m 0.28031014278531075m -0.049922227125772496m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Aggressiveness</div>
        </button>
        <button class="Hotspot dyad" slot="hotspot-optimism" data-position="-0.05845778195849223m 0.28031014278531075m -0.1277782556213392m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Optimism</div>
        </button>
        <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
        </div>
        <button slot="ar-button" id="ar-button">
          View in your space
        </button>
        <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
        </div>
      </model-viewer>
      <div id="emotion-details" class="emotion-details"></div>
      <div id="assessment-modal" class="modal">
        <div class="modal-content">
          <span class="close-modal">&times;</span>
          <div id="assessment-steps"></div>
        </div>
      </div>
    </div>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script type="module">
      const emotionData = {
        'Serenity': { desc: 'Serenity is a mild form of joy, bringing peace and tranquility.', primary: 'Joy' },
        'Joy': { desc: 'Joy is a positive emotion of happiness and contentment.', combinations: {'Trust': 'Love', 'Anticipation': 'Optimism', 'Fear': 'Guilt', 'Surprise': 'Delight', 'Sadness': 'Bittersweetness', 'Anger': 'Pride'} },
        'Ecstasy': { desc: 'Ecstasy is an intense form of joy, overwhelming happiness.', primary: 'Joy' },
        'Acceptance': { desc: 'Acceptance is a mild form of trust, openness to others.', primary: 'Trust' },
        'Trust': { desc: 'Trust is confidence in others, forming bonds.', combinations: {'Joy': 'Love', 'Fear': 'Submission', 'Surprise': 'Curiosity', 'Sadness': 'Sentimentality', 'Anticipation': 'Hope', 'Disgust': 'Ambivalence'} },
        'Admiration': { desc: 'Admiration is an intense form of trust, deep respect.', primary: 'Trust' },
        'Apprehension': { desc: 'Apprehension is a mild form of fear, cautious worry.', primary: 'Fear' },
        'Fear': { desc: 'Fear is a response to perceived threat, for protection.', combinations: {'Trust': 'Submission', 'Joy': 'Guilt', 'Surprise': 'Awe', 'Sadness': 'Despair', 'Disgust': 'Shame', 'Anger': 'Frozenness', 'Anticipation': 'Anxiety'} },
        'Terror': { desc: 'Terror is an intense form of fear, extreme dread.', primary: 'Fear' },
        'Distraction': { desc: 'Distraction is a mild form of surprise, mild startle.', primary: 'Surprise' },
        'Surprise': { desc: 'Surprise is reaction to unexpected events.', combinations: {'Fear': 'Awe', 'Joy': 'Delight', 'Trust': 'Curiosity', 'Sadness': 'Disapproval', 'Disgust': 'Unbelief', 'Anger': 'Outrage', 'Anticipation': 'Confusion'} },
        'Amazement': { desc: 'Amazement is an intense form of surprise, wonder.', primary: 'Surprise' },
        'Pensiveness': { desc: 'Pensiveness is a mild form of sadness, reflective melancholy.', primary: 'Sadness' },
        'Sadness': { desc: 'Sadness is response to loss or disappointment.', combinations: {'Surprise': 'Disapproval', 'Joy': 'Bittersweetness', 'Trust': 'Sentimentality', 'Fear': 'Despair', 'Disgust': 'Remorse', 'Anger': 'Envy', 'Anticipation': 'Pessimism'} },
        'Grief': { desc: 'Grief is an intense form of sadness, deep sorrow.', primary: 'Sadness' },
        'Boredom': { desc: 'Boredom is a mild form of disgust, lack of interest.', primary: 'Disgust' },
        'Disgust': { desc: 'Disgust is aversion to something offensive.', combinations: {'Sadness': 'Remorse', 'Trust': 'Ambivalence', 'Fear': 'Shame', 'Surprise': 'Unbelief', 'Anger': 'Contempt', 'Anticipation': 'Cynicism'} },
        'Loathing': { desc: 'Loathing is an intense form of disgust, strong hatred.', primary: 'Disgust' },
        'Annoyance': { desc: 'Annoyance is a mild form of anger, irritation.', primary: 'Anger' },
        'Anger': { desc: 'Anger is response to perceived injustice or threat.', combinations: {'Disgust': 'Contempt', 'Fear': 'Frozenness', 'Joy': 'Pride', 'Surprise': 'Outrage', 'Sadness': 'Envy', 'Anticipation': 'Aggressiveness'} },
        'Rage': { desc: 'Rage is an intense form of anger, furious outrage.', primary: 'Anger' },
        'Interest': { desc: 'Interest is a mild form of anticipation, curiosity.', primary: 'Anticipation' },
        'Anticipation': { desc: 'Anticipation is looking forward to future events.', combinations: {'Anger': 'Aggressiveness', 'Joy': 'Optimism', 'Trust': 'Hope', 'Fear': 'Anxiety', 'Surprise': 'Confusion', 'Sadness': 'Pessimism', 'Disgust': 'Cynicism'} },
        'Vigilance': { desc: 'Vigilance is an intense form of anticipation, alertness.', primary: 'Anticipation' },
        // Dyads
        'Love': { desc: 'Love combines joy and trust, leading to affection and bonding.' },
        'Submission': { desc: 'Submission combines trust and fear, resulting in compliance.' },
        'Awe': { desc: 'Awe combines fear and surprise, inspiring wonder and respect.' },
        'Disapproval': { desc: 'Disapproval combines surprise and sadness, expressing disagreement.' },
        'Remorse': { desc: 'Remorse combines sadness and disgust, feeling regret.' },
        'Contempt': { desc: 'Contempt combines disgust and anger, showing disdain.' },
        'Aggressiveness': { desc: 'Aggressiveness combines anger and anticipation, driving action.' },
        'Optimism': { desc: 'Optimism combines anticipation and joy, hopeful expectation.' }
      };

      const primaries = ['Joy', 'Trust', 'Fear', 'Surprise', 'Sadness', 'Disgust', 'Anger', 'Anticipation'];
      const adjectives = {
        'Joy': ['happy', 'joyful', 'glad', 'cheerful'],
        'Trust': ['trusting', 'accepting', 'admiring', 'respectful'],
        'Fear': ['fearful', 'scared', 'afraid', 'terrified'],
        'Surprise': ['surprised', 'amazed', 'astonished', 'shocked'],
        'Sadness': ['sad', 'gloomy', 'depressed', 'miserable'],
        'Disgust': ['disgusted', 'repulsed', 'contemptuous', 'disdainful'],
        'Anger': ['angry', 'mad', 'furious', 'enraged'],
        'Anticipation': ['anticipatory', 'expectant', 'hopeful', 'vigilant']
      };

      const dyads = {
        'Joy-Trust': 'Love',
        'Trust-Fear': 'Submission',
        'Fear-Surprise': 'Awe',
        'Surprise-Sadness': 'Disapproval',
        'Sadness-Disgust': 'Remorse',
        'Disgust-Anger': 'Contempt',
        'Anger-Anticipation': 'Aggressiveness',
        'Anticipation-Joy': 'Optimism'
      };

      const wheelOrder = ['Joy', 'Trust', 'Fear', 'Surprise', 'Sadness', 'Disgust', 'Anger', 'Anticipation'];

      const hotspots = document.querySelectorAll('.Hotspot');
      const details = document.getElementById('emotion-details');
      const assessBtn = document.getElementById('assess-btn');
      const modal = document.getElementById('assessment-modal');
      const stepsDiv = document.getElementById('assessment-steps');
      const closeModal = document.querySelector('.close-modal');

      hotspots.forEach(hotspot => {
        hotspot.addEventListener('click', () => {
          const emotion = hotspot.querySelector('.HotspotAnnotation').textContent;
          const data = emotionData[emotion] || { desc: 'No description available.' };
          let html = `<h2>${emotion}</h2><p>${data.desc}</p>`;
          if (data.combinations) {
            html += '<h3>Combinations:</h3><ul>';
            for (const [other, comb] of Object.entries(data.combinations)) {
              html += `<li>${emotion} + ${other} = ${comb}</li>`;
            }
            html += '</ul>';
          }
          if (data.primary) {
            html += `<p>This is a variant of <strong>${data.primary}</strong>. See ${data.primary} for combinations.</p>`;
          }
          html += '<button class="close">Close</button>';
          details.innerHTML = html;
          details.classList.add('show');
        });
      });

      details.addEventListener('click', (e) => {
        if (e.target.classList.contains('close')) {
          details.classList.remove('show');
        }
      });

      closeModal.addEventListener('click', () => {
        modal.style.display = 'none';
      });

      assessBtn.addEventListener('click', () => {
        startAssessment();
      });

      function startAssessment() {
        modal.style.display = 'block';
        stepsDiv.innerHTML = '';
        showStep(1);
      }

      function showStep(step) {
        let html = '';
        if (step === 1) {
          html = `<h2>Step 1: Take a Breath</h2>
                  <div class="breath-animation"></div>
                  <p>Take a deep breath and notice what you're feeling right now.</p>
                  <button onclick="showStep(2)">Next</button>`;
        } else if (step === 2) {
          html = `<h2>Step 2: Select Emotions</h2>
                  <p>Which of these do you feel? Select all that apply.</p>
                  <div class="emotion-select">`;
          primaries.forEach(em => {
            html += `<label><input type="checkbox" value="${em}"> ${em}</label>`;
          });
          html += `</div><button onclick="showStep(3)">Next</button>`;
        } else if (step === 3) {
          const selected = Array.from(document.querySelectorAll('.emotion-select input:checked')).map(cb => cb.value);
          if (selected.length === 0) {
            alert('Please select at least one emotion.');
            return;
          }
          html = `<h2>Step 3: Rate Intensity</h2>
                  <p>On a scale of 1-7, how strongly do you feel these?</p>
                  <form id="rating-form">`;
          selected.forEach(em => {
            html += `<h3>${em}</h3>`;
            adjectives[em].forEach(adj => {
              html += `<label>${adj}: <input type="range" min="1" max="7" value="1" name="${em}-${adj}"></label><br>`;
            });
          });
          html += `</form><button onclick="calculateResults()">Finish Quest</button>`;
        }
        stepsDiv.innerHTML = html;
        stepsDiv.classList.add('fade-in');
      }

      window.showStep = showStep;

      window.calculateResults = () => {
        const form = document.getElementById('rating-form');
        const scores = {};
        primaries.forEach(em => scores[em] = 0);
        const inputs = form.querySelectorAll('input[type="range"]');
        inputs.forEach(input => {
          const [em] = input.name.split('-');
          scores[em] += parseInt(input.value);
        });
        for (const em in scores) {
          scores[em] /= adjectives[em].length; // average
        }
        const sorted = Object.entries(scores).filter(([em, score]) => score > 3).sort((a,b) => b[1] - a[1]); // threshold 3
        let html = `<h2>Your Results</h2>`;
        if (sorted.length === 0) {
          html += `<p>No strong emotions detected. Try again!</p>`;
        } else {
          html += `<p>Your top emotions:</p><ul>`;
          sorted.forEach(([em, score]) => {
            html += `<li>${em}: ${score.toFixed(1)}</li>`;
          });
          html += `</ul>`;
          // Check for dyads
          const highEmotions = sorted.map(([em]) => em);
          const possibleDyads = [];
          for (let i = 0; i < highEmotions.length; i++) {
            for (let j = i+1; j < highEmotions.length; j++) {
              const pair = [highEmotions[i], highEmotions[j]].sort((a,b) => wheelOrder.indexOf(a) - wheelOrder.indexOf(b)).join('-');
              if (dyads[pair]) {
                possibleDyads.push(`${highEmotions[i]} + ${highEmotions[j]} = ${dyads[pair]}`);
              }
              // Check if adjacent (circular)
              const idx1 = wheelOrder.indexOf(highEmotions[i]);
              const idx2 = wheelOrder.indexOf(highEmotions[j]);
              if (Math.abs(idx1 - idx2) === 1 || Math.abs(idx1 - idx2) === 7) { // adjacent or wrap around
                const sortedPair = idx1 < idx2 ? `${highEmotions[i]}-${highEmotions[j]}` : `${highEmotions[j]}-${highEmotions[i]}`;
                if (dyads[sortedPair]) {
                  possibleDyads.push(`${highEmotions[i]} + ${highEmotions[j]} = ${dyads[sortedPair]}`);
                }
              }
            }
          }
          if (possibleDyads.length > 0) {
            html += `<h3>Possible Combinations:</h3><ul>${possibleDyads.map(d => `<li>${d}</li>`).join('')}</ul>`;
          }
          html += `<p>What do these feelings want you to notice or do?</p>`;
        }
        html += `<button onclick="modal.style.display = 'none'">Close</button>`;
        stepsDiv.innerHTML = html;
      };
    </script>
  </body>
</html>
